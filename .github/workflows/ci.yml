name: CI/CD Pipeline — PDBL-MLOPS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ══════════════════════════════════════════════════════════════
  # JOB 1: Lint & Build Frontend (Next.js)
  # ══════════════════════════════════════════════════════════════
  lint-and-build-frontend:
    name: 🔨 Frontend — Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Build Next.js
        run: npm run build

  # ══════════════════════════════════════════════════════════════
  # JOB 2: Test Backend (FastAPI)
  # ══════════════════════════════════════════════════════════════
  test-backend:
    name: 🐍 Backend — Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify imports
        run: python -c "from schemas import PredictInput, PredictOutput; from admin_schemas import AdminLoginRequest, EDAStats; print('✅ All imports OK')"

  # ══════════════════════════════════════════════════════════════
  # JOB 3: Docker Build
  # ══════════════════════════════════════════════════════════════
  docker-build:
    name: 🐳 Docker — Build Images
    runs-on: ubuntu-latest
    needs: [lint-and-build-frontend, test-backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: docker build -t pdbl-frontend:latest .

      - name: Build Backend Docker Image
        run: docker build -t pdbl-backend:latest ./backend

      - name: Verify images
        run: |
          docker images | grep pdbl
          echo "✅ Docker images built successfully"
